                bottleneck: 32
          - name: sa
            levels:
              - name: b4
                bottleneck: 4
              - name: b8
                bottleneck: 8
              - name: b16
                bottleneck: 16
              - name: b32
                bottleneck: 32
          - name: sapa
            levels:
              - name: b4
                bottleneck: 4
              - name: b8
                bottleneck: 8
              - name: b16
                bottleneck: 16
              - name: b32
